[package]
name = "proglog-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
hyper = "1.6.0"
serde = { version = "1.0.219", features = ["derive"] }
anyhow = "1.0.98"
base64 = "0.22.1"
tonic = "0.13.1"
prost = "0.13.5"
byteorder = "1.5.0"
tempfile = "3.20.0"
memmap2 = "0.9.5"

[build-dependencies]
tonic-build = "0.13.1"
prost-build = "0.13.5"

[dev-dependencies]
assert2 = "0.3"
