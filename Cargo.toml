[package]
name = "proglog-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
hyper = "1.6.0"
serde = { version = "1.0.219", features = ["derive"] }
anyhow = "1.0.98"
base64 = "0.22.1"
tonic = "0.13.1"
prost = "0.13.5"
byteorder = "1.5.0"
tempfile = "3.20.0"
memmap2 = "0.9.5"
prost-helper = "0.1"
async-trait = "0.1.88"
tokio-stream = "0.1.17"

[build-dependencies]
tonic-build = "0.13.1"
prost-build = "0.13.5"
prost-serde = "0.1"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
assert2 = "0.3"
tonic-mock = "0.4.0"
